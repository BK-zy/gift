<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion of the Day</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* 容器固定比例，背景圖會自動填滿 */
        .page-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            display: none; /* 預設先隱藏所有頁面 */
        }
        /* 當前顯示的頁面 */
        .page-container.active {
            display: block;
        }

        /* 按鈕基礎樣式 */
        .btn {
            position: absolute;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #333333;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #333333;
            color: #ffffff;
            transform: scale(1.05);
        }

        /* 右下角按鈕定位 */
        .bottom-right-btns {
            position: absolute;
            bottom: 5%;
            right: 5%;
            display: flex;
            gap: 15px;
        }
        /* 讓右下角內部按鈕不需要絕對定位 */
        .bottom-right-btns .btn {
            position: static;
        }

        /* --- 第一頁 PLAY 按鈕 --- */
        #page1 .play-btn {
            left: 50%;
            top: 57%; 
            transform: translateX(-50%);
        }
        #page1 .play-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* --- 第三頁按鈕區域 --- */
        .emotion-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* 完全透明按鈕基礎設定 */
        .emotion-btn {
            position: absolute;
            background: transparent; 
            border: none;             
            cursor: pointer;          
            color: transparent;       
        }

        /* 第三頁開心與難過按鈕 (10%) */
        .btn-happy {
            left: 17%;
            top: 10%; 
            width: 30%;
            height: 30%;
        }
        .btn-sad {
            right: 17%;
            top: 10%; 
            width: 30%;
            height: 30%;
        }
        .btn-angry {
            left: 17%;
            top: 55%;
            width: 30%;
            height: 30%;
        }
        .btn-random {
            right: 17%;
            top: 55%;
            width: 30%;
            height: 30%;
        }

        /* --- 第四頁與第五頁文字基礎樣式與個別定位 --- */
        .text-overlay {
            position: absolute;
            width: 50%;
            height: 50%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            color: #333;
        }
        
        /* 🎯 第四頁文字位置設定 */
        .p4-text-position {
            top: 20%;   
            left: 45%;  
        }

        /* 🎯 第五頁文字位置設定 */
        .p5-text-position {
            top: 10%;   
            left: 25%;  
        }

        .song-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .song-artist {
            font-size: 20px;
            color: #666;
            margin-bottom: 20px;
        }
        .story-text {
            font-size: 20px;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <!-- ================= 第一頁 ================= -->
    <div id="page1" class="page-container active" style="background-image: url('p1.png');">
        <button class="btn play-btn" onclick="goToPage('page2')">PLAY</button>
    </div>

    <!-- ================= 第二頁 ================= -->
    <div id="page2" class="page-container" style="background-image: url('p2.png');">
        <div class="bottom-right-btns">
            <button class="btn" onclick="goToPage('page3')">SKIP</button>
        </div>
    </div>

    <!-- ================= 第三頁 ================= -->
    <div id="page3" class="page-container" style="background-image: url('p3.png');">
        <div class="emotion-area">
            <button class="emotion-btn btn-happy" onclick="pickSong('happy')">開心</button>
            <button class="emotion-btn btn-sad" onclick="pickSong('sad')">難過</button>
            <button class="emotion-btn btn-angry" onclick="pickSong('angry')">生氣</button>
            <button class="emotion-btn btn-random" onclick="pickSong('random')">隨機</button>
        </div>
        <div class="bottom-right-btns">
            <button class="btn" onclick="goToPage('page2')">返回</button>
        </div>
    </div>

    <!-- ================= 第四頁 ================= -->
    <div id="page4" class="page-container" style="background-image: url('p4.png');">
        <div class="text-overlay p4-text-position">
            <div id="p4-title" class="song-title">歌名</div>
            <div id="p4-artist" class="song-artist">歌手</div>
        </div>
        <div class="bottom-right-btns">
            <button class="btn" onclick="goToPage('page3')">上一頁</button>
            <button class="btn" onclick="goToPage('page5')">下一頁</button>
        </div>
    </div>

    <!-- ================= 第五頁 ================= -->
    <div id="page5" class="page-container" style="background-image: url('p5.png');">
        <div class="text-overlay p5-text-position">
            <div id="p5-story" class="story-text">這裡是這首歌對應的感性文字內容...</div>
        </div>
        <div class="bottom-right-btns">
            <button class="btn" onclick="goToPage('page4')">上一頁</button>
            <button class="btn" onclick="goToPage('page1')">首頁</button>
        </div>
    </div>

    <!-- 🎵 全站背景音樂（前三頁重複播放，可自行替換檔名 bgm.mp3） -->
    <audio id="bgm-music" src="bgm.mp3" loop></audio>

    <!-- 🎵 單曲音樂播放器 (第四、五頁播放歌曲) -->
    <audio id="bg-music"></audio>

    <!-- ================= JavaScript 邏輯控制 ================= -->
    <script>
        // 🎵 歌曲資料庫（包含每首歌對應的 mp3 檔名）
        const songDatabase = [
            { id: 1, category: 'happy', title: '达尔文', artist: '蔡健雅', story: '要天天开心哦--小呆宝', audio: 'happy1.mp3' },
            { id: 2, category: 'happy', title: '日不落', artist: '蔡依林', story: '天天很棒，不要内耗，快乐勇敢的向前冲，我们一直在--淡然', audio: 'happy2.mp3' },
            { id: 3, category: 'happy', title: '彩虹', artist: '周杰伦', story: '一起冲呀！小晗天天开心呀！--春光', audio: 'happy3.mp3' },
            { id: 4, category: 'happy', title: '遇见', artist: '孙燕姿', story: '因为遇见天天的那一天我的心情非常糟糕，是天天的声音治愈了我，谢谢天天也谢谢播间的姐姐们--小鱼', audio: 'happy4.mp3' },
            { id: 5, category: 'happy', title: '情书', artist: '沈以诚', story: '镜头下的每一帧都是你存在的痕迹--懵懵嘻嘻', audio: 'happy5.mp3' },
            { id: 6, category: 'happy', title: '失重旅行', artist: '吴宇恒', story: '叮咚！开启失重旅行，迎接此刻轻盈自由的快乐！--褚橙', audio: 'happy6.mp3' },
            { id: 7, category: 'happy', title: '超兽武装', artist: '刘罡、陈洁丽', story: '~~~--叮铃铃', audio: 'happy7.mp3' },
            { id: 8, category: 'happy', title: '小美满', artist: '周深', story: '~~~--小兔', audio: 'happy8.mp3' },
            { id: 9, category: 'sad',   title: 'coco', artist: '侃迪kandi', story: '小day，我错了还不行嘛，我给你道歉～--宝欣', audio: 'sad1.mp3' },
            { id: 10, category: 'sad',   title: '我成为我的同时', artist: '十个勤天', story: '希望天天要天天开心，好好吃饭，好好睡觉，不要焦虑，你本身就很好--晚星', audio: 'sad2.mp3' },
            { id: 11, category: 'sad',   title: '我怀念的', artist: '孙燕姿', story: '起起伏伏本就是常态，当下的委屈和不顺都只是一程。守得住心境，往后自有豁然开朗的时候--落幕', audio: 'sad3.mp3' },
            { id: 12, category: 'sad',   title: '送你一朵小红花', artist: '赵英俊', story: '别难过啦～给你小红花--一桉', audio: 'sad4.mp3' },
            { id: 13, category: 'sad',   title: '无赖', artist: '郑中基', story: '不许难过！你要开心开心开心开心--懵懵嘻嘻', audio: 'sad5.mp3' },
            { id: 14, category: 'sad',   title: '陷落美好', artist: '易烊千玺', story: '允许自己短暂低落，陷落之后，终会遇见美好--褚橙', audio: 'sad6.mp3' },
            { id: 15, category: 'sad',   title: '唯一的偏爱', artist: 'en王翊恩', story: '~~~--白白', audio: 'sad7.mp3' },
            { id: 16, category: 'sad',   title: '开心往前飞', artist: '开心超人主题曲', story: '今天的不开心到此为止吧～明天依旧要开心往前飞！--困困', audio: 'sad8.mp3' },
            { id: 17, category: 'sad',   title: '不败的英雄', artist: '铠甲勇士刑天主题曲', story: '~~~--叮铃铃', audio: 'sad9.mp3' },
            { id: 18, category: 'sad',   title: '左手右手', artist: '喜羊羊电影插曲', story: '~~~--叮铃铃', audio: 'sad10.mp3' },
            { id: 19, category: 'angry', title: '爱久见人心', artist: '梁靜茹', story: '谁惹你生气，我去biubiubiu了他！--懵懵嘻嘻', audio: 'angry1.mp3' },
            { id: 20, category: 'angry', title: '万物盛开法则', artist: '大张伟', story: '不生气不生气～气坏身体无人替～--困困', audio: 'angry2.mp3' },
            { id: 21, category: 'angry', title: '猪猪侠', artist: '陈洁丽', story: '~~~--叮铃铃', audio: 'angry3.mp3' }
        ];

        let currentSong = null;
        const audioElement = document.getElementById('bg-music');
        const bgmElement = document.getElementById('bgm-music');

        // 設定背景音樂音量為 0.2 (20% 小音量)
        bgmElement.volume = 0.2;

        function goToPage(pageId) {
            document.querySelectorAll('.page-container').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            // 💡 頁面切換音訊處理邏輯
            if (pageId === 'page1' || pageId === 'page2' || pageId === 'page3') {
                // 1. 停止播放第四、五頁的單曲
                audioElement.pause();
                audioElement.currentTime = 0;

                // 2. 播放/繼續播放背景音樂 (只會在暫停狀態時觸發播放，不會每次開頭重放)
                if (bgmElement.paused) {
                    bgmElement.play().catch(error => {
                        console.log("背景音樂自動播放受限:", error);
                    });
                }
            } else if (pageId === 'page4' || pageId === 'page5') {
                // 進入歌曲相關頁面，暫停背景音樂（保留進度）
                bgmElement.pause();
            }
        }

        function pickSong(emotion) {
            let filteredSongs = [];

            if (emotion === 'random') {
                filteredSongs = songDatabase;
            } else {
                filteredSongs = songDatabase.filter(song => song.category === emotion);
            }

            if (filteredSongs.length > 0) {
                const randomIndex = Math.floor(Math.random() * filteredSongs.length);
                currentSong = filteredSongs[randomIndex];

                // 更新頁面文字
                document.getElementById('p4-title').innerText = currentSong.title;
                document.getElementById('p4-artist').innerText = currentSong.artist;
                document.getElementById('p5-story').innerText = currentSong.story;

                // 🎵 載入音樂並自動播放單曲
                audioElement.src = currentSong.audio;
                audioElement.play().catch(error => {
                    console.log("自動播放被瀏覽器阻擋或找不到檔案:", error);
                });

                goToPage('page4');
            }
        }
    </script>
</body>
</html>
